[build]
  command = "npm run build"
  publish = "dist"

[functions]
  external_node_modules = ["express", "cookie-session", "cors", "googleapis", "dotenv", "@google/genai"]
  node_bundler = "esbuild"

# Redirect API calls to the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api"
  status = 200

# Handle SPA routing for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
